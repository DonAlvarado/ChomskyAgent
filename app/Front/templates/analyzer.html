{% extends "layout.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Analizador de Gramáticas / Autómatas</h2>

<div class="bg-white p-6 rounded-xl shadow-md border border-mintgreen">

    <label class="block font-semibold text-gray-700 mb-2">
        Ingresa reglas de la gramática (una por línea):
    </label>

    <textarea id="grammarInput"
              class="w-full h-40 p-3 border rounded-md focus:ring-2 focus:ring-turquoise"
              placeholder="S → aSb&#10;S → ab"></textarea>

    <button id="btnAnalyze"
            class="mt-4 px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
        Analizar
    </button>

    <div id="analysisOutput" class="mt-6 hidden">
        <h3 class="text-xl font-bold text-gray-800">Resultado:</h3>
        <p id="resultType" class="mt-2 text-lg font-semibold text-turquoise"></p>
        <ul id="resultExplain" class="mt-4 list-disc pl-6 text-gray-700"></ul>
    </div>

</div>

<script defer src="{{ url_for('static', filename='js/analyzer.js') }}"></script>

{% endblock %}
