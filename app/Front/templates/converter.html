{% extends "layout.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Conversor de Expresiones Regulares</h2>

<div class="bg-white p-6 rounded-xl shadow-md border border-mintgreen">

    <label class="block font-semibold text-gray-700 mb-2">
        Expresión regular:
    </label>
    <input id="regexInput"
           type="text"
           class="w-full p-3 border rounded-md focus:ring-2 focus:ring-turquoise font-mono"
           placeholder="(a|b)*abb">

    <div class="flex flex-wrap gap-4 mt-4">
        <button id="btnRegexToNFA"
                class="px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
            Regex → AFN-ε
        </button>

        <button id="btnRegexToAFD"
                class="px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
            Regex → AFD
        </button>

        <button id="btnRegexToGrammar"
                class="px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
            Regex → Gramática regular
        </button>

        <button id="btnRegexToAFDMin"
                class="px-6 py-2 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
            Regex → AFD Minimizado
        </button>

        <button id="btnVisualizeAFDMin"
                class="px-6 py-2 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
            Ver AFD Minimizado
        </button>


    </div>

    <div id="convOutput" class="mt-8 hidden">
        <h3 class="text-xl font-bold text-gray-800 mb-2">Resultado:</h3>
        <pre id="convResult" class="bg-gray-100 p-4 rounded-lg text-sm overflow-auto"></pre>
    </div>

</div>

<script defer src="{{ url_for('static', filename='js/converter.js') }}"></script>

{% endblock %}
