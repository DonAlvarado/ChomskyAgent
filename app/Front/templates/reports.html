{% extends "layout.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Reportes Generados</h2>

<div class="bg-white p-6 rounded-xl shadow-md border border-mintgreen">

    <p class="text-gray-700 mb-4">
        Aquí puedes ver y descargar reportes generados por el sistema.
    </p>

    <button id="btnLoadReports"
            class="px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
        Cargar reportes
    </button>

    <ul id="reportList" class="mt-6 space-y-3">
        <!-- Se llenará dinámicamente -->
    </ul>

</div>

<script defer src="{{ url_for('static', filename='js/reports.js') }}"></script>

{% endblock %}
