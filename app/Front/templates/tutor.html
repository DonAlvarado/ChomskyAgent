{% extends "layout.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Modo Tutor (Quiz)</h2>

<div class="bg-white p-6 rounded-xl shadow-md border border-mintgreen">

    <p class="text-gray-700 mb-4">
        El sistema generará una gramática o autómata aleatorio. Intenta clasificarlo.
    </p>

    <button id="btnGenerate"
            class="px-6 py-3 bg-turquoise text-white rounded-lg shadow hover:bg-cyanlight transition">
        Generar ejercicio
    </button>

    <div id="exerciseBox" class="mt-6 hidden">
        <h3 class="text-xl font-semibold text-turquoise mb-2">Ejercicio</h3>
        <pre id="exerciseText"
             class="bg-gray-100 p-4 rounded-lg text-gray-700 whitespace-pre-wrap"></pre>

        <label class="block mt-4 font-semibold text-gray-700">
            Tu respuesta:
        </label>

        <select id="userAnswer"
                class="p-3 border rounded-md">
            <option value="">Selecciona el tipo…</option>
            <option>Tipo 0</option>
            <option>Tipo 1</option>
            <option>Tipo 2</option>
            <option>Tipo 3</option>
        </select>

        <button id="btnCheck"
                class="mt-4 px-6 py-3 bg-cyanlight text-white rounded-lg shadow hover:bg-turquoise transition">
            Verificar
        </button>
    </div>

    <div id="feedbackBox" class="mt-6 hidden">
        <h3 class="text-xl font-bold text-gray-800">Resultado</h3>
        <p id="feedbackText" class="mt-2 text-lg"></p>
    </div>

</div>

<script defer src="{{ url_for('static', filename='js/tutor.js') }}"></script>

{% endblock %}
